# Records on every push to main which lines and files each test touches, for test.yml to pick a pull request's
# tests from. It never gates: recording makes the suite slower and a timing test may fail under it.
name: map

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-main
  cancel-in-progress: true

env:
  FASTCI: "git+https://github.com/syalia-srl/fastci@v0.2.1"

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Record the map
        run: |
          uvx --from "$FASTCI" fastci map record --out "$RUNNER_TEMP/fastci/map.json.gz" -- -n auto -m "not slow" \
            || echo "::warning title=fastci::suite failed under recording"
      - uses: actions/upload-artifact@v7
        with:
          name: fastci
          path: ${{ runner.temp }}/fastci/map.json.gz
          retention-days: 14
