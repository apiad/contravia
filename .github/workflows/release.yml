# The single-file game for Linux and Windows. A pushed tag vX.Y.Z builds both files and publishes them as
# that tag's release; a manual run builds them as workflow artifacts only, to try the packaging. The province
# sources the game ships are not in git: they come from the release sources-v<contravia.source.VERSION>.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: packaging/launcher/go.mod
          cache: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Free-threaded Python with pip, for picking the cp314t wheels
        run: |
          uv python install 3.14t
          echo "PIP_PYTHON=$(uv python find 3.14t)" >> "$GITHUB_ENV"
      - name: The province sources, from the release of their version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^VERSION = \([0-9]*\).*/\1/p' contravia/source.py)
          gh release download "sources-v$v" --pattern cuba-src.tar.zst --output - | tar --zstd -x -C data
          ls data/cuba-src | wc -l
      - name: Build the files
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: packaging/build.sh out
      - name: The Linux file builds a province into an empty home
        run: |
          mkdir -p smoke/src && cp data/cuba-src/cienfuegos.src smoke/src/
          out/contravia build --source "$PWD/smoke/src" --home "$PWD/smoke/home"
          test -f smoke/home/build.json && test -f smoke/home/cuba/cienfuegos.npz && test -f smoke/home/cuba/index.npz
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/contravia out/contravia.exe \
            --title "Contravía $GITHUB_REF_NAME" --generate-notes
      - name: Keep the files of a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: contravia-${{ github.sha }}
          path: out/
          retention-days: 7
