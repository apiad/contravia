# The checks and the test suite, run by fastci: on main the whole fast suite, on a pull request only the tests the
# change can break, using the map map.yml records on main. `fastci plan` says what runs and why. lavapipe (mesa-vulkan-drivers) gives the runner a software
# Vulkan adapter, so the render tests run here instead of skipping.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTCI: "git+https://github.com/syalia-srl/fastci@v0.2.1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Every path declares its licence
        run: uvx reuse lint
      - name: fastci
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from "$FASTCI" fastci

  signoff:
    # Every commit of a pull request carries Signed-off-by (CONTRIBUTING.md, the Developer Certificate of Origin).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.base_ref }}
        run: |
          missing=$(git log --format='%H %(trailers:key=Signed-off-by,valueonly,separator=%x2C)' \
            "origin/$BASE..HEAD" --no-merges | awk 'NF < 2 {print $1}')
          if [ -n "$missing" ]; then echo "commits without Signed-off-by:"; echo "$missing"; exit 1; fi
          echo "$(git rev-list --count --no-merges "origin/$BASE..HEAD") commits signed off"
