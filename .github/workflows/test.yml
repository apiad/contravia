# The checks and the test suite, run by fastci: on main the whole fast suite, on a pull request only the tests the
# change can break, using the map map.yml records on main. `fastci plan` says what runs and why. lavapipe (mesa-vulkan-drivers) gives the runner a software
# Vulkan adapter, so the render tests run here instead of skipping.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  FASTCI: "git+https://github.com/syalia-srl/fastci@v0.2.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: fastci
        env:
          GH_TOKEN: ${{ github.token }}
        run: uvx --from "$FASTCI" fastci
