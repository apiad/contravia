# The landing page on GitHub Pages: site/ with the branding and fonts it loads by relative path, and a root that
# sends the visitor to site/.
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "branding/**", "assets/fonts/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Lay out the page
        run: |
          mkdir -p _site/assets
          cp -r site branding _site/
          cp -r assets/fonts _site/assets/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=site/"><link rel="canonical" href="site/"><title>Contravía</title><a href="site/">Contravía</a>\n' > _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
