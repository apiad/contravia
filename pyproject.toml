[project]
name = "havana-driver"
version = "0.1.0"
description = "An open-world driving game in a procedural, real-size Havana, built on manifoldx."
requires-python = ">=3.14"
dependencies = ["numpy", "manifold-gfx[desktop]"]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
]

[project.scripts]
havana = "havana.cli:main"

[dependency-groups]
prepare = ["osmium", "shapely", "tifffile", "imagecodecs"]
dev = ["pytest", "ruff", "pillow", "osmium", "shapely", "tifffile", "imagecodecs"]

[tool.uv.sources]
manifold-gfx = { git = "https://github.com/gia-uh/manifoldx", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["havana"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.pytest.ini_options]
markers = ["slow: timing tests on city-sized inputs"]
