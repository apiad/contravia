[project]
name = "contravia"
version = "0.1.0"
description = "An open-world driving game in a procedural, real-size Havana, built on manifoldx."
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
dependencies = ["numpy", "scipy", "shapely", "pillow", "manifold-gfx[desktop,svg,audio]", "euterpe"]

classifiers = [
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
]

[project.scripts]
contravia = "contravia.cli:main"

[dependency-groups]
prepare = ["osmium", "tifffile", "imagecodecs"]
dev = ["pytest", "pytest-xdist", "ruff", "osmium", "tifffile", "imagecodecs"]

[tool.uv.sources]
manifold-gfx = { git = "https://github.com/gia-uh/manifoldx", branch = "main" }
euterpe = { git = "https://github.com/gia-uh/euterpe", rev = "8c9b8f39428aa4d0e6fe2b1ab6641257ab70c512" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contravia"]

[tool.ruff]
line-length = 110
target-version = "py314"

# fastci runs the checks and the tests a change can break (https://syalia.com/fastci/).
# format and lint are off until the repo is ruff-clean: 126 files would be
# reformatted and ruff check finds 24 errors on main.
[tool.fastci.tests]
args = ["-n", "auto", "-rs"]

[tool.fastci.stages]
format = ""
lint = ""
rift = { run = "uvx --from git+https://github.com/apiad/rift@v0.9.0 rift check", after = "lock" }

[tool.pytest.ini_options]
markers = ["slow: timing tests on city-sized inputs"]
